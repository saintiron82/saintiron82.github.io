<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>초파리의 습격</title>
<meta name="description" content="초파리에게서 인류의 존엄을 보여주세요. 실제 초파리 뇌 7,858개 뉴런과의 그림 맞추기 대결.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%278%27 fill=%27%230a0c12%27/%3E%3Ctext x=%276%27 y=%2731%27 font-size=%2728%27%3E🪰%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c12; --panel:#151a26; --panel2:#1b2130; --line:#2a3242;
    --ink:#eef1f7; --dim:#8290a8; --faint:#5a6479;
    --ok:#4ade80; --you:#5aa2ff; --fly:#ff6fb5;
    --gap:14px; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{overscroll-behavior:none;max-width:100%;overflow-x:hidden}
  body{
    margin:0;padding:12px 14px calc(16px + env(safe-area-inset-bottom));
    background:
      radial-gradient(1100px 620px at 12% -8%, #16203a 0%, transparent 62%),
      radial-gradient(900px 560px at 92% 4%, #2a1430 0%, transparent 58%),
      var(--bg);
    background-attachment:fixed;color:var(--ink);
    font:13px/1.6 "Noto Sans KR",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .mono{font-family:"Roboto Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}

  .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  h1{margin:0;font-family:"Jua",sans-serif;font-size:23px;font-weight:400;letter-spacing:0;
     background:linear-gradient(92deg,var(--you),#c9a6ff 42%,var(--fly));
     -webkit-background-clip:text;background-clip:text;color:transparent}
  #brain{color:var(--faint);font-size:10.5px;flex:1 1 100%;order:9}
  .head .sub{flex:1 1 100%;order:1;color:var(--fly);font-size:12.5px;
             font-weight:700;margin-top:-2px;letter-spacing:-.2px}
  @media (orientation:portrait),(max-width:840px){#brain{display:none}}

  .hud{display:flex;align-items:stretch;gap:10px;margin-bottom:var(--gap)}
  .chip{flex:1;display:flex;align-items:center;gap:10px;padding:9px 12px;min-width:0;
        background:linear-gradient(180deg,var(--panel2),var(--panel));
        border:1px solid var(--line);border-radius:var(--r)}
  .chip.me{border-color:#2b4a7a;box-shadow:0 0 22px -12px var(--you)}
  .chip.bug{border-color:#6b2a4d;box-shadow:0 0 22px -12px var(--fly)}
  .chip .nm{font-family:"Jua",sans-serif;font-weight:400;font-size:16px;white-space:nowrap}
  .me .nm{color:var(--you)} .bug .nm{color:var(--fly)}
  .chip .col{flex:1;min-width:0}
  .chip .num{font-size:19px;font-weight:800;line-height:1.1}
  .chip .cap{color:var(--faint);font-size:10px;font-weight:400}
  .track{height:6px;border-radius:4px;background:#0c1017;overflow:hidden;margin-top:5px}
  .track i{display:block;height:100%;width:0;border-radius:4px;
           transition:width .28s cubic-bezier(.3,1.4,.5,1)}
  .me .track i{background:linear-gradient(90deg,#2f6fd0,var(--you))}
  .bug .track i{background:linear-gradient(90deg,#b8397c,var(--fly))}
  .vs{align-self:center;font-weight:900;font-size:13px;color:var(--faint);letter-spacing:1px}
  .clockbox{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
            justify-content:center;padding:6px 12px;border-radius:var(--r);
            border:1px solid var(--line);background:var(--panel)}
  .clockbox .t{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .clockbox .c{color:var(--faint);font-size:9.5px}

  .bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:var(--gap);
       background:linear-gradient(180deg,var(--panel2),var(--panel));
       border:1px solid var(--line);border-radius:var(--r);padding:9px 12px}
  .bar label{color:var(--dim);font-size:11.5px;font-weight:600}
  select{background:#0c1017;color:var(--ink);border:1px solid var(--line);border-radius:8px;
         padding:6px 9px;font-size:13px;max-width:46vw;font-family:inherit}
  input[type=range]{accent-color:var(--fly);height:20px}
  button{background:linear-gradient(180deg,#2f7bff,#1c5fe0);color:#fff;border:0;border-radius:10px;
         padding:9px 22px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;
         box-shadow:0 6px 18px -8px #2f7bff;transition:transform .08s}
  button:active{transform:translateY(1px)}
  button.ghost{background:#222a38;box-shadow:none;font-weight:600;padding:6px 12px;
               font-size:12px;border:1px solid var(--line)}
  button:disabled{opacity:.4;box-shadow:none}

  .arena{display:grid;gap:var(--gap);align-items:start;
         grid-template-columns:1fr 232px 1fr;grid-template-areas:"you mid fly"}
  .a-you{grid-area:you}.a-mid{grid-area:mid}.a-fly{grid-area:fly}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));
        border:1px solid var(--line);border-radius:var(--r);padding:11px}
  .card.you{border-color:#28405f}.card.fly{border-color:#5a2843}
  .card h2{margin:0 0 9px;font-size:13px;font-weight:700;color:var(--dim);
           display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card h2 small{color:var(--faint);font-weight:400;font-size:10.5px;text-align:right}
  .a-mid .card h2 small{display:block;text-align:left;margin-top:3px}
  .wrap{position:relative;border-radius:10px;overflow:hidden}
  .wrap canvas,.tgtwrap canvas{max-width:100%;max-height:100%}
  canvas{display:block;width:100%;max-width:100%;height:auto;background:#05070b;
         image-rendering:pixelated}
  #you{cursor:grab;touch-action:none}
  #you.dragging{cursor:grabbing}
  .a-you .wrap{box-shadow:0 0 0 1px #24384f,0 14px 40px -24px var(--you)}
  .a-fly .wrap{box-shadow:0 0 0 1px #4a2238,0 14px 40px -24px var(--fly)}

  .veil{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
        background:rgba(6,8,13,.78);font-size:34px;font-weight:900;letter-spacing:3px}
  .veil.on{display:flex}
  .veil.count{font-family:"Jua",sans-serif;font-size:clamp(60px,17vw,110px);letter-spacing:0;color:#fff;
              text-shadow:0 0 40px #2f7bff88}
  .veil.count span{display:block;animation:cIn .85s cubic-bezier(.2,1.6,.4,1)}
  @keyframes cIn{0%{transform:scale(.35);opacity:0}45%{transform:scale(1);opacity:1}
                 100%{transform:scale(1.18);opacity:.25}}

  .bubble{position:relative;margin:0 0 10px;padding:9px 12px;border-radius:12px;
          background:linear-gradient(180deg,#2b1a2e,#231827);border:1px solid #5a2843;
          color:#ffd9ec;font-size:13px;line-height:1.42;min-height:42px;
          display:flex;align-items:center;gap:8px}
  .bubble::after{content:"";position:absolute;left:26px;bottom:-7px;width:12px;height:12px;
                 background:#231827;border-right:1px solid #5a2843;
                 border-bottom:1px solid #5a2843;transform:rotate(45deg)}
  .bubble .em{flex:0 0 auto;font-size:17px}
  .thinking .em{animation:bob 1.1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}
                 50%{transform:translateY(-4px) rotate(6deg)}}

  .stat{margin-top:9px;font-size:11.5px;color:var(--dim)}
  .scan{margin-top:6px;height:5px;border-radius:3px;background:#0c1017;overflow:hidden}
  .scan i{display:block;height:100%;width:0;transition:width .08s linear;
          background:linear-gradient(90deg,#8a2d63,var(--fly))}

  .meta{margin-top:9px}
  .hint{color:var(--faint);font-size:10.5px;line-height:1.5;text-align:center}
  .maps{display:flex;gap:6px;margin-top:10px}
  .maps>div{flex:1;text-align:center;color:var(--faint);font-size:9.5px}
  .maps canvas{border-radius:7px}
  #target{cursor:zoom-in}
  .tgtwrap{position:relative;border-radius:10px;overflow:hidden;
           box-shadow:0 0 0 1px #2a3242,0 12px 30px -22px #000}
  .tgtwrap .tag{position:absolute;right:6px;bottom:5px;pointer-events:none;
                font-size:9px;color:#dfe6f5;background:#0009;padding:2px 6px;border-radius:6px}

  #over{position:fixed;inset:0;z-index:60;display:none;align-items:center;
        justify-content:center;background:rgba(5,7,12,.86);padding:20px}
  #over.on{display:flex}
  #over .box{width:min(420px,92vw);text-align:center;padding:22px;border-radius:20px;
             background:linear-gradient(180deg,var(--panel2),var(--panel));
             border:1px solid var(--line);animation:cIn2 .3s ease-out}
  @keyframes cIn2{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  #over .big{font-family:"Jua",sans-serif;font-size:50px;letter-spacing:0;margin-bottom:4px}
  #over .why{color:#ffd9ec;font-size:15px;line-height:1.55;margin:4px 0 18px;
             font-weight:700}
  /* 줄다리기: 한 줄 위에서 양쪽이 서로 밀고 당긴다. 가운데 눈금이 반반 자리다. */
  #over .tallyhead{color:var(--faint);font-size:10.5px;letter-spacing:.4px;margin-bottom:6px}
  #over .tug{margin-bottom:6px}
  #over .tug .ends{display:flex;justify-content:space-between;align-items:baseline;
                   font-size:11.5px;color:var(--faint);margin-bottom:5px}
  #over .tug .ends b{font-size:19px;font-weight:900;
                     font-family:"Roboto Mono",ui-monospace,monospace}
  #over .tug .ends .me b{color:var(--you)}
  #over .tug .ends .bug b{color:var(--fly)}
  #over .rope .p{position:absolute;top:0;bottom:0;display:flex;align-items:center;
                 font-size:11px;font-weight:800;color:#fff;
                 text-shadow:0 1px 2px #0009;pointer-events:none}
  #over .rope .pMe{left:8px}
  #over .rope .pBug{right:8px}
  #over .tugsay{text-align:center;font-size:13.5px;margin:10px 0 16px;
                color:var(--ink);line-height:1.5;min-height:20px;font-weight:700}
  #over .rope{position:relative;height:22px;border-radius:9px;overflow:hidden;
              background:linear-gradient(90deg,#6b2a4d,var(--fly));
              box-shadow:inset 0 1px 3px #0008}
  #over .rope i{position:absolute;left:0;top:0;bottom:0;width:50%;z-index:0;
                background:linear-gradient(90deg,var(--you),#2f6fd0);
                border-right:2px solid #0b0d12;
                transition:width .7s cubic-bezier(.3,1.2,.4,1)}
  #over .rope u{position:absolute;left:50%;top:0;bottom:0;width:0;
                border-left:1px dashed rgba(255,255,255,.35)}

  #confetti{position:fixed;inset:0;z-index:55;pointer-events:none;display:none;
            width:100%;height:100%;background:none}
  #confetti.on{display:block}
  #howto{position:fixed;inset:0;z-index:58;display:none;align-items:center;
         justify-content:center;background:rgba(5,7,12,.88);padding:18px}
  #howto.on{display:flex}
  #howto .box{width:min(460px,94vw);max-height:88vh;overflow:auto;padding:20px;
              border-radius:20px;text-align:left;
              background:linear-gradient(180deg,var(--panel2),var(--panel));
              border:1px solid var(--line);animation:cIn2 .25s ease-out}
  #howto .big{font-family:"Jua",sans-serif;font-size:26px;text-align:center;
              margin-bottom:12px;color:var(--ink)}
  #howto .rules{margin:0 0 14px;padding-left:18px;color:var(--dim);font-size:13px;
                line-height:1.75}
  #howto .rules li{margin-bottom:7px}
  #howto .rules b{color:var(--ink)}
  #howto .howTally{color:var(--dim);font-size:12px;margin-bottom:10px;
                   background:#0d121b;border:1px solid var(--line);
                   border-radius:10px;padding:8px 10px}
  #howto .howTally:empty{display:none}
  #howto .dia{display:block;width:100%;height:auto;margin:0 0 12px;
              background:#0b0f16;border:1px solid var(--line);border-radius:12px;padding:6px}
  #howto .nav{display:flex;gap:8px;margin-bottom:10px}
  #howto .nav button{flex:1}
  #howto .nav .ghost{flex:0 0 auto}
  #howto .skip{display:flex;align-items:center;gap:7px;color:var(--faint);
               font-size:12px;margin-bottom:14px;cursor:pointer}

  #zoom{position:fixed;inset:0;z-index:50;display:none;align-items:center;
        justify-content:center;background:rgba(5,7,12,.95);padding:16px;cursor:zoom-out}
  #zoom.on{display:flex}
  #zoom canvas{width:auto;height:auto;max-width:96vw;max-height:80vh;border-radius:14px}
  #zoom .tip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;
             text-align:center;color:var(--dim);font-size:12px}

  .credit{margin-top:18px;color:#495264;font-size:10px;line-height:1.6}
  .credit a{color:#5d6b85}

  /* ---- 세로 화면 ----
     위 한 줄에 원본과 초파리를 작게, 나머지는 전부 내 판에. 초파리 판은 보기만
     하는 것이라 작아도 되고, 내 판은 엄지가 닿는 아래쪽에 크게 있어야 한다. */
  @media (orientation:portrait),(max-width:840px){
    :root{--gap:8px;--r:12px}
    /* 한 화면에 들어가야 한다. 세로로 쌓고, 남는 높이를 전부 내 판에 준다.
       판 크기는 JS 의 fit() 이 실제 남은 공간을 재서 픽셀로 박아 넣는다 --
       캔버스에 width:auto 를 주면 고유폭이 그대로 나와 가로 스크롤이 생긴다. */
    html,body{height:100%}
    body{height:100vh;height:100dvh;   /* dvh 를 모르는 브라우저는 vh 로 */
         overflow:hidden;display:flex;flex-direction:column;
         padding:8px 9px calc(8px + env(safe-area-inset-bottom))}
    .head,.hud,.bar{flex:0 0 auto}
    /* 두 줄 다 비율로 고정한다. auto 로 두면 줄 높이가 캔버스 크기에 달리고
       캔버스 크기는 다시 줄 높이에 달려서, 재려는 값이 순환한다. */
    .arena{flex:1 1 auto;min-height:0;align-items:stretch;
           grid-template-rows:minmax(0,.34fr) minmax(0,1fr)}
    .a-you,.a-fly,.a-mid{min-width:0;min-height:0}
    .a-you .card{height:100%;display:flex;flex-direction:column}
    .a-you .wrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;
                 justify-content:center}
    /* 세로 그림을 가로로 넓은 칸에 넣으면 양옆이 빈다. 위 띠는 그림을 왼쪽에
       세우고 남는 폭을 글이 쓰게 가른다. 폭을 %로 고정해야 fit() 이 잴 수 있다 --
       auto 로 두면 칸 폭이 캔버스에, 캔버스가 다시 칸 폭에 달려 순환한다. */
    .a-mid .card{height:100%;display:flex;flex-direction:column;gap:4px}
    .a-mid .card h2{margin:0;flex:0 0 auto}
    .a-mid .tgtwrap{flex:1 1 auto;min-height:0;display:flex;
                    align-items:center;justify-content:center}
    .a-fly .card{height:100%;display:grid;gap:3px 9px;align-content:center;
                 grid-template-columns:40% minmax(0,1fr);
                 grid-template-areas:"img head" "img bub" "img stat" "img scan"}
    .a-fly .wrap{grid-area:img;height:100%;display:flex;align-items:center;
                 justify-content:center}
    .a-fly .card h2{grid-area:head;margin:0}
    .a-fly .bubble{grid-area:bub;margin:0}
    .a-fly .stat{grid-area:stat;margin:0}
    .a-fly .scan{grid-area:scan;margin:0}
    .credit{display:none}
    .chip .col,.chip .num{min-width:0}
    .chip .num{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .head{gap:8px;margin-bottom:7px}
    .bar{gap:5px 7px;padding:6px 8px;flex-wrap:wrap;overflow:visible}
    .bar label{display:none}
    .bar label.keep{display:inline;font-size:14px;line-height:1}
    .bar>span{display:flex;align-items:center;gap:4px;min-width:0;flex:0 1 auto}
    button.ghost{padding:5px 7px;font-size:11px;flex:0 0 auto}
    #pickImg{font-size:0;padding:5px 8px}
    #pickImg::after{content:"\1F5BC";font-size:13px}
    input[type=range]{width:62px!important;flex:0 0 auto}
    #speedv{flex:0 0 auto;font-size:10px}
    button.ghost{padding:5px 8px;font-size:11px}
    input[type=range]{width:82px!important}
    h1{font-size:19px}
    .head .sub{font-size:11.5px}
    .hud{gap:6px}
    .chip{flex-direction:column;align-items:stretch;gap:1px;padding:5px 8px}
    .chip .nm{font-size:11px;line-height:1.15}
    .chip .num{font-size:14px;line-height:1.15}
    .chip .cap{font-size:9px}
    .track{height:5px;margin-top:3px}
    .chip>.cap{align-self:flex-end;margin-top:-13px}
    .vs{display:none}
    .clockbox{padding:4px 7px}.clockbox .t{font-size:15px}.clockbox .c{font-size:8.5px}
    .arena{grid-template-columns:minmax(0,1fr) minmax(0,1fr);
           grid-template-areas:"mid fly" "you you"}
    .card{padding:8px}
    .a-mid .card,.a-fly .card{height:100%}
    .card h2{margin-bottom:6px;font-size:11.5px;white-space:nowrap;overflow:hidden}
    .a-fly .card h2 small,.a-mid .card h2 small{display:none}
    .a-fly .card h2{text-overflow:ellipsis}
    #target,#fly,#you{width:auto;height:auto;margin:0 auto}
    .a-fly .wrap,.a-you .wrap,.tgtwrap{display:flex;justify-content:center}
    .tgtwrap .tag{font-size:8.5px;right:4px;bottom:3px}
    .maps{display:none}
    .meta{display:none}
    .hint{display:none}
    .bubble{font-size:12px;min-height:0;padding:7px 9px;margin-bottom:7px;line-height:1.35}
    .bubble::after{display:none}
    .a-fly .stat{font-size:10px}
    .a-you .card h2 small{display:none}
    select{width:auto;min-width:0;max-width:37vw;flex:0 1 auto;
            font-size:12px;padding:5px 5px;text-overflow:ellipsis}
    #pic{max-width:26vw}
    #speedv{flex:0 0 auto;font-size:11px;color:var(--fly);font-weight:700;
            min-width:26px;text-align:right}
    button{padding:10px 18px}
    .credit{font-size:9px;margin-top:11px}
  }
  @media (orientation:portrait) and (max-height:730px){
    .hint{display:none}
    .head h1{font-size:17px}
  }
</style>
</head>
<body>

<div class="head">
  <h1 data-i18n="ui.title"></h1>
  <div class="sub" data-i18n="ui.subtitle"></div>
  <button id="go" disabled data-i18n="ui.start"></button>
  <div id="brain" class="mono" data-i18n="ui.loading"></div>
</div>

<div class="hud">
  <div class="chip me">
    <span class="nm" data-i18n="ui.you"></span>
    <div class="col">
      <div class="num mono"><span id="youHome">0</span><span class="cap"> / <span
        id="tot">0</span> <span data-i18n="ui.home"></span></span></div>
      <div class="track"><i id="youBar"></i></div>
    </div>
    <div class="cap mono"><span id="youMoves">0</span><span data-i18n="ui.moves"></span></div>
  </div>
  <div class="vs">VS</div>
  <div class="clockbox"><div class="t mono" id="clock">0.0</div>
    <div class="c" data-i18n="ui.sec"></div></div>
  <div class="chip bug">
    <span class="nm" data-i18n="ui.flyEmoji"></span>
    <div class="col">
      <div class="num mono"><span id="flyHome">0</span><span class="cap"> / <span
        id="tot2">0</span> <span data-i18n="ui.home"></span></span></div>
      <div class="track"><i id="flyBar"></i></div>
    </div>
    <div class="cap mono"><span id="flyMoves">0</span><span data-i18n="ui.moves"></span></div>
  </div>
</div>

<div class="bar">
  <span><label data-i18n="ui.difficulty"></label>
    <select id="size">

<script>
const $ = id => document.getElementById(id);

/**
 * Language packs live in lang.js. Anything a pack leaves out falls back to
 * Korean, so a half-finished translation degrades to a mixed page rather than
 * a blank one.
 */
let L = null, LANGKEY = "ko";
function T(path){
  const walk = o => path.split(".").reduce((v,k)=> (v == null ? v : v[k]), o);
  const v = walk(L);
  return (v === undefined || v === null) ? walk(LANG.ko) : v;
}
function fmt(str, vars){
  let out = String(str);
  for(const k in (vars||{})) out = out.split("{"+k+"}").join(vars[k]);
  return out;
}
function setLang(key){
  LANGKEY = LANG[key] ? key : "ko";
  L = LANG[LANGKEY];
  try{ localStorage.setItem("btf:lang", LANGKEY); }catch(e){}
  document.documentElement.lang = LANGKEY;
  applyLang();
}
function applyLang(){
  document.title = T("ui.title");
  for(const el of document.querySelectorAll("[data-i18n]"))
    el.textContent = T(el.getAttribute("data-i18n"));
  for(const el of document.querySelectorAll("[data-i18n-html]"))
    el.innerHTML = T(el.getAttribute("data-i18n-html"));
  for(const el of document.querySelectorAll("[data-i18n-list]")){
    const rows = T(el.getAttribute("data-i18n-list")) || [];
    el.innerHTML = rows.map(r => "<li>" + r + "</li>").join("");
  }
  labelSizes();
  labelPictures();
  showSpeed();
  if(S.neurons) brainLine();
  if(!S.pieces) $("hint").textContent = T("ui.hintIdle");
}
function labelPictures(){
  const names = T("pictures") || {};
  for(const o of $("pic").options)
    if(names[o.value]) o.textContent = names[o.value];
}
function brainLine(){
  $("brain").textContent = fmt(T("ui.brain"), {
    n: (S.neurons || 7858).toLocaleString(),
    e: (S.edges || 7107).toLocaleString(),
    kb: S.brainKB || 175,
  });
}
// 세로 화면에서는 판도 세로로 세운다. 가로 3x4 는 세로에서 4x3 이 된다 -- 같은
// 조각 수인데 폰에서는 조각이 두 배 가까이 커져서 엄지로 누를 만해진다.
const SIZES_LAND = [[2,3],[3,4],[4,4],[4,5],[5,6]];
const SIZES_PORT = [[3,2],[4,3],[4,4],[5,4],[6,5]];
// 초파리의 정직한 속도는 후보 한 장에 18 ms -- 뇌가 하나라 한 장씩 보고,
// 광수용체에서 라미나까지 12~22 ms가 걸린다. 가속은 그걸 몇 배로 돌리는가다.
const BASE_MS = 18, SPEEDS = [0.1, 0.5, 1, 2, 5, 10];
const MAPW = 30, MAPH = 20, PRW = 48, PRH = 30;
const SWAP_MS = 190;                       // 조각이 미끄러지는 시간
let fly = null, S = {}, picture = null;

const portrait = () => window.matchMedia("(orientation:portrait),(max-width:840px)").matches;
const frame = () => portrait() ? Puzzle.PORT : Puzzle.LAND;

// ------------------------------------------------------------------ 대사
const pick = a => a[(Math.random() * a.length) | 0];
let lastLine = "";
function says(kind, vars){
  const pool = T("lines." + kind) || T("lines.look");
  let s = pick(pool);
  for(let i=0;i<4 && s===lastLine;i++) s = pick(pool);
  lastLine = s;
  for(const k in (vars||{})) s = s.split("{"+k+"}").join(vars[k]);
  $("says").textContent = s;
}
const thinking = on => $("bubble").classList.toggle("thinking", !!on);

// ------------------------------------------------------------------ 소리
// 받아오는 음원은 없다. 전부 그 자리에서 합성하는 짧은 음이고, 첫 소리는 시작
// 버튼이라는 사용자 동작 뒤에 나므로 브라우저 자동재생 정책에 걸리지 않는다.
let AC = null, muted = false;
function tone(freq, dur, type, vol, when){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const t = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol === undefined ? 0.12 : vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
const SFX = {
  tick : ()=>tone(1500, .028, "square", .012),
  pick : ()=>tone(620, .07, "triangle", .10),
  drop : ()=>tone(300, .06, "triangle", .08),
  swap : ()=>{ tone(400, .09, "triangle", .11); tone(560, .09, "triangle", .09, .05); },
  land : ()=>{ tone(880, .12, "sine", .14); tone(1320, .14, "sine", .10, .06); },
  count: n=>tone(n > 0 ? 520 : 900, n > 0 ? .12 : .3, "sine", .14),
  win  : ()=>[0,.1,.2,.34].forEach((d,i)=>tone([523,659,784,1047][i], .3, "sine", .15, d)),
  lose : ()=>[0,.12,.26].forEach((d,i)=>tone([392,330,247][i], .34, "sine", .13, d)),
};
$("mute").onclick = ()=>{
  muted = !muted;
  $("mute").textContent = muted ? "\u{1F508}" : "\u{1F50A}";
  $("mute").setAttribute("aria-pressed", String(muted));
  if(!muted) SFX.pick();
};

// ------------------------------------------------------------------ 꽃가루
function confetti(colours){
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.classList.add("on");
  const bits = Array.from({length:150}, ()=>({
    x: innerWidth * (.2 + .6 * Math.random()),
    y: -20 - Math.random() * innerHeight * .4,
    vx: (Math.random() - .5) * 3.4, vy: 2 + Math.random() * 4.2,
    w: 5 + Math.random() * 7, h: 8 + Math.random() * 10,
    a: Math.random() * 6.28, va: (Math.random() - .5) * .35,
    c: colours[(Math.random() * colours.length) | 0],
  }));
  const t0 = performance.now();
  (function frame(now){
    const age = now - t0;
    ctx.clearRect(0, 0, cv.width, cv.height);
    for(const b of bits){
      b.x += b.vx; b.y += b.vy; b.vy += .07; b.a += b.va;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a);
      ctx.globalAlpha = Math.max(0, 1 - age / 3600);
      ctx.fillStyle = b.c; ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
      ctx.restore();
    }
    if(age < 3600) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, cv.width, cv.height); cv.classList.remove("on"); }
  })(t0);
}

// ------------------------------------------------------------------ 지도
const RAMP=[[12,16,26],[30,58,110],[20,140,160],[120,200,90],[250,200,60],[255,255,235]];
function tint(v){
  const t=Math.max(0,Math.min(1,v))*(RAMP.length-1), i=Math.min(RAMP.length-2,t|0), f=t-i;
  const a=RAMP[i],b=RAMP[i+1];
  return "rgb("+a.map((x,k)=>Math.round(x+(b[k]-x)*f)).join(",")+")";
}
function drawMap(id,m,gw,gh){
  const cv=$(id); if(!cv) return;
  const ctx=cv.getContext("2d"), w=cv.width/gw, h=cv.height/gh;
  ctx.fillStyle="#05070b"; ctx.fillRect(0,0,cv.width,cv.height);
  for(let y=0;y<gh;y++) for(let x=0;x<gw;x++){
    const v=m[y*gw+x]; if(v===null||v===undefined) continue;
    ctx.fillStyle=tint(v); ctx.fillRect(x*w,y*h,Math.ceil(w),Math.ceil(h));
  }
}

// ------------------------------------------------------------------ 판
const slotXY = (slot,tw,th,cols) => [(slot%cols)*tw, ((slot/cols)|0)*th];

function paint(id, board, opt){
  const o=opt||{}, cv=$(id), ctx=cv.getContext("2d"), P=S.pieces;
  if(!P||!board) return;
  const tw=cv.width/P.cols, th=cv.height/P.rows;
  ctx.fillStyle="#05070b"; ctx.fillRect(0,0,cv.width,cv.height);
  board.forEach((piece,slot)=>{
    if(o.hide && o.hide.indexOf(slot)>=0) return;
    const [x,y]=slotXY(slot,tw,th,P.cols);
    ctx.drawImage(P.tiles[piece],x,y,tw,th);
    ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.lineWidth=1;   // 조각 경계
    ctx.strokeRect(x+.5,y+.5,tw-1,th-1);
    if(piece===slot){
      ctx.strokeStyle="#4ade80"; ctx.lineWidth=3;
      ctx.strokeRect(x+2,y+2,tw-4,th-4);
      if(o.pop && o.pop.indexOf(slot)>=0){            // 방금 제자리에 들어왔다
        ctx.strokeStyle="#4ade80"; ctx.lineWidth=7;
        ctx.strokeRect(x+4,y+4,tw-8,th-8);
      }
    }
  });
  for(const slot of (o.mark||[])){
    if(slot<0) continue;
    const [x,y]=slotXY(slot,tw,th,P.cols);
    // 테두리만. 반투명하게 덮으면 조각 색이 물들어 무슨 그림인지 안 보인다.
    ctx.strokeStyle="rgba(0,0,0,.65)"; ctx.lineWidth=6;
    ctx.strokeRect(x+3,y+3,tw-6,th-6);
    ctx.strokeStyle=o.colour||"#fff"; ctx.lineWidth=4;
    ctx.strokeRect(x+3,y+3,tw-6,th-6);
  }
  for(const m of (o.moving||[])){                     // 미끄러지는 조각
    ctx.save(); ctx.shadowColor="#000a"; ctx.shadowBlur=14;
    ctx.drawImage(P.tiles[m.piece], m.x, m.y, tw, th);
    ctx.restore();
    ctx.strokeStyle=o.colour||"#fff"; ctx.lineWidth=3;
    ctx.strokeRect(m.x+1.5,m.y+1.5,tw-3,th-3);
  }
}

/** Two pieces actually travel past each other, so a move reads as a move. */
function animateSwap(id, before, after, i, j, colour, done, keepMark){
  const P=S.pieces, cv=$(id);
  if(!P){ done&&done(); return; }
  const tw=cv.width/P.cols, th=cv.height/P.rows;
  const [xi,yi]=slotXY(i,tw,th,P.cols), [xj,yj]=slotXY(j,tw,th,P.cols);
  const t0=performance.now();
  let over=false;
  function land(){
    if(over) return;
    over=true; clearTimeout(guard);
    const landed=[i,j].filter(s=>after[s]===s);
    const mark = keepMark ? [i,j] : null;
    paint(id, after, {mark, colour, pop:landed});
    if(landed.length) setTimeout(()=>paint(id, after, {mark, colour}), 260);
    done&&done();
  }
  // requestAnimationFrame 은 탭이 안 보이면 멈춘다. 그때 애니메이션이 끝나지
  // 않으면 이 콜백을 기다리던 초파리도 영영 다음 수를 못 둔다. 그림은 못 보여도
  // 판은 계속 가야 하므로 타이머로 한 번 더 막는다.
  const guard = setTimeout(land, SWAP_MS + 260);
  (function step(now){
    if(over) return;
    const u=Math.min(1,(now-t0)/SWAP_MS);
    const e=u<.5 ? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2;   // ease in-out
    paint(id, before, {hide:[i,j], colour, moving:[
      {piece:before[i], x:xi+(xj-xi)*e, y:yi+(yj-yi)*e},
      {piece:before[j], x:xj+(xi-xj)*e, y:yj+(yi-yj)*e}]});
    if(u<1) return requestAnimationFrame(step);
    land();
  })(t0);
}


/**
 * Size the three canvases to the space that is actually there.
 *
 * A canvas is a replaced element: leave it at width:auto and it takes its
 * intrinsic width, which on a phone pushed the page wider than the screen and
 * gave it a horizontal scrollbar. So the backing store stays at the frame's
 * own pixels and the CSS size is set here, in pixels, from the measured box.
 */
/**
 * Give the board the room, then let the browser tell us the boxes.
 *
 * Measuring a box in the same breath as changing the layout that decides it is
 * how this kept coming out wrong: read too early and you size the canvas from
 * the previous frame, and a canvas larger than its box is simply clipped. So
 * fit() now only splits the rows, and a ResizeObserver per box sizes the canvas
 * afterwards, from a rectangle the browser has already settled. Nothing here
 * depends on the order the two happen in, or on any guess about font metrics.
 */
function fit(){
  const P = S.pieces; if(!P) return;
  const arena = document.querySelector(".arena");
  if(!portrait()){
    for(const id of ["you","fly","target"]){ $(id).style.width=""; $(id).style.height=""; }
    arena.style.gridTemplateRows = "";
    return;
  }
  const youCard = document.querySelector(".a-you .card");
  const cc = getComputedStyle(youCard), cs = getComputedStyle(arena);
  const gap = parseFloat(cs.rowGap) || 8;
  const availW = arena.clientWidth, availH = arena.clientHeight;
  if(availW < 40 || availH < 40) return;

  // 내 판 카드에서 캔버스 말고 나머지가 먹는 높이. 캔버스 크기와 무관하다.
  const h2 = youCard.querySelector("h2"), st = youCard.querySelector(".stat");
  const chrome = (h2 ? h2.offsetHeight : 0) + (st ? st.offsetHeight : 0) +
    parseFloat(cc.paddingTop) + parseFloat(cc.paddingBottom) + 4;
  const padX = parseFloat(cc.paddingLeft) + parseFloat(cc.paddingRight) + 2;

  // 내 판이 우선. 폭을 다 쓰는 높이를 구하고 남는 만큼만 위 띠에 준다.
  const ar = P.fw / P.fh;
  const byWidth = (availW - padX) / ar;
  const room = availH - gap - chrome;
  // 판이 폭에 묶이면 남는 높이를 위 띠가 갖는다. 다만 원본이 알아볼 수 없을
  // 만큼 작아지면 게임이 안 되므로, 화면에 비례한 바닥값을 둔다.
  const floor = Math.max(120, availH * 0.28), ceil = Math.min(availH * 0.48, room - 110);
  let strip = Math.max(floor, Math.min(room - byWidth, ceil));
  if(strip > room - 110) strip = Math.max(96, room - 110);
  arena.style.gridTemplateRows = Math.round(strip) + "px minmax(0,1fr)";
}

/** Size a canvas to whatever box the browser just gave its wrapper. */
function observe(id, sel){
  const wrap = document.querySelector(sel);
  if(!wrap || typeof ResizeObserver === "undefined") return;
  new ResizeObserver(function(entries){
    const P = S.pieces; if(!P) return;
    const b = entries[0].contentRect;
    if(b.width < 12 || b.height < 12) return;
    const ar = P.fw / P.fh, cv = $(id);
    const sz = Math.min(b.width / ar, b.height);
    const w = Math.max(40, Math.floor(sz * ar)), h = Math.max(40, Math.floor(sz));
    if(cv.style.width === w + "px" && cv.style.height === h + "px") return;
    cv.style.width = w + "px"; cv.style.height = h + "px";
    clearTimeout(S.repaint);
    S.repaint = setTimeout(repaint, 16);
  }).observe(wrap);
}

function repaint(){
  if(!S.pieces) return;
  paint("you", S.human, S.pick >= 0 ? {mark:[S.pick], colour:"#5aa2ff"} : null);
  paint("fly", S.fly);
  if(S.big){
    const t = $("target"), c = t.getContext("2d");
    const w = t.clientWidth || t.width, h = t.clientHeight || t.height;
    t.width = Math.max(40, Math.round(w * 2));
    t.height = Math.max(40, Math.round(h * 2));
    c.imageSmoothingEnabled = true;
    c.drawImage(S.big, 0, 0, t.width, t.height);
  }
}

function relayout(){
  if(!S.pieces) return;
  fit();
  repaint();
}


/**
 * Everybody's games, added up, on a free public counter.
 *
 * Worth being plain about what this is. Nothing can authenticate a static page,
 * so the endpoint that adds one is open to anyone with curl -- the number counts
 * what was reported, not what was played, and the card says so underneath. It
 * also lives on someone else's free service: two of the three like it that I
 * tried were already dead, so every call is allowed to fail and the page shows
 * nothing rather than a wrong number.
 */
const TALLY = "https://abacus.jasoncameron.dev";
const TALLY_NS = "beat-the-fly";
function tallyRead(key){
  return fetch(TALLY + "/get/" + TALLY_NS + "/" + key, {cache:"no-store"})
    .then(r => r.ok ? r.json() : {value:0})
    .then(j => j.value | 0)
    .catch(() => null);
}
function tallyHit(key){
  return fetch(TALLY + "/hit/" + TALLY_NS + "/" + key, {cache:"no-store"})
    .then(r => r.ok ? r.json() : null)
    .then(j => j ? (j.value | 0) : null)
    .catch(() => null);
}
function tallyShow(h, f){
  const known = (h !== null && h !== undefined) || (f !== null && f !== undefined);
  const H = h | 0, F = f | 0, T = H + F;
  $("tallyHuman").textContent = known ? H.toLocaleString() : "–";
  $("tallyFly").textContent   = known ? F.toLocaleString() : "–";
  const pct = T ? (100 * H / T) : 50;
  const me = Math.round(pct), bug = 100 - me;
  $("tugMe").style.width = pct.toFixed(1) + "%";
  $("tugPctMe").textContent  = (known && T) ? me + "%" : "";
  $("tugPctFly").textContent = (known && T) ? bug + "%" : "";
  $("tugSay").innerHTML = (known && T) ? tugSay(me) : "";
}

/** A line for wherever the rope has ended up. */
/**
 * A line for wherever the rope has ended up.
 *
 * The jokes stay on the facts this rests on -- 7,858 neurons, 7,107 edges and
 * every one of them inhibitory, one candidate board per 18 ms, and a brain that
 * only ever reports how close two pictures look.
 */
function tugSay(me){
  for(const band of (T("tug") || []))
    if(me >= band[0]) return pick(band[1]);
  return "";
}


const home = b => b.reduce((n,p,s)=>n+(p===s?1:0),0);
function hud(){
  const h=home(S.human), f=home(S.fly);
  $("youHome").textContent=h; $("flyHome").textContent=f;
  $("youMoves").textContent=S.moves.human; $("flyMoves").textContent=S.moves.fly;
  $("youBar").style.width=(100*h/S.n)+"%";
  $("flyBar").style.width=(100*f/S.n)+"%";
}

// ------------------------------------------------------------------ 한 판
/** Back to the opening state: settings in reach, nothing running. */
function idle(){
  if(S.turn) S.turn.stop();
  clearInterval(S.clock); clearTimeout(S.count); thinking(false);
  $("over").classList.remove("on"); $("zoom").classList.remove("on");
  for(const v of ["youVeil","flyVeil"]){ $(v).className="veil"; $(v).textContent=""; }
  S.winner = "idle"; S.locked = true; S.pick = -1;
  $("clock").textContent = "0.0";
  $("hint").textContent = T("ui.hintIdle");
  $("seen").textContent = "\u2014";
  $("scanBar").style.width = "0%";
  says("look", {seen:1, of:S.n || 66, ms:String(Math.round(S.lookMs || 18))});
  $("go").disabled = false;
  $("go").textContent = T("ui.start");
}

function start(){
  if(!fly) return;
  if(S.turn) S.turn.stop();
  clearInterval(S.clock); clearTimeout(S.count);
  $("over").classList.remove("on"); $("zoom").classList.remove("on");
  const F=frame();
  const [rows,cols]=(portrait()?SIZES_PORT:SIZES_LAND)[+$("size").value];
  const lookMs=BASE_MS/SPEEDS[+$("speed").value];
  const img=($("pic").value==="mine" && picture)
    ? picture : Puzzle.picture($("pic").value,(Math.random()*1e9)|0,F);
  const P=new Puzzle.Pieces(img,rows,cols,F);
  const board=Puzzle.shuffled(P.n,Puzzle.mulberry((Math.random()*1e9)|0));
  const solved=Array.from({length:P.n},(_,i)=>i);

  S={ pieces:P, lookMs, speed:SPEEDS[+$("speed").value],
      neurons:S.neurons, edges:S.edges,
      human:board.slice(), fly:board.slice(), n:P.n,
      moves:{human:0,fly:0}, pick:-1, winner:null, lastHome:home(board), said:0,
      target: Float64Array.from(fly.look(P.render(solved))) };

  const col=document.querySelector(".a-you");
  const wide=Math.min(560,Math.max(280,(col&&col.clientWidth|0)||360));
  for(const id of ["you","fly"]){
    const cv=$(id); cv.width=wide; cv.height=Math.round(wide*P.fh/P.fw);
  }
  const t=$("target"); t.height=Math.round(t.width*P.fh/P.fw);
  const tc=document.createElement("canvas"); tc.width=P.fw; tc.height=P.fh;
  tc.getContext("2d").drawImage(img,0,0,P.fw,P.fh);
  t.getContext("2d").drawImage(tc,0,0,t.width,t.height);
  S.big=tc;

  const cands=P.n*(P.n-1)/2;
  $("tot").textContent=P.n; $("tot2").textContent=P.n;
  $("lvl").textContent = fmt(T("ui.level"), {n:P.n, best:Puzzle.owed(board)});
  $("flyTip").textContent = fmt(T("ui.flyTip"),
    {c:cands, ms:lookMs.toFixed(lookMs<10?1:0)});
  hud();
  lastLine=""; says("look",{seen:1,of:cands,ms:lookMs.toFixed(0)});
  relayout();
  countdown(3);
}

function countdown(left){
  if(left>0){
    S.locked=true;
    for(const v of ["youVeil","flyVeil"]){
      $(v).innerHTML="<span>"+left+"</span>"; $(v).className="veil count on";
    }
    $("clock").textContent=left; $("hint").textContent=T("ui.ready"); SFX.count(left);
    S.count=setTimeout(()=>countdown(left-1),900);
    return;
  }
  for(const v of ["youVeil","flyVeil"]){ $(v).className="veil"; $(v).textContent=""; }
  $("clock").textContent="0.0";
  $("hint").textContent=T("ui.hintPlay");
  SFX.count(0);
  S.locked=false; S.started=Date.now();
  S.clock=setInterval(()=>{ if(!S.winner)
    $("clock").textContent=((Date.now()-S.started)/1000).toFixed(1); },100);
  flyTurn();
}

function flyTurn(){
  if(S.winner) return;
  thinking(true);
  S.turn=new Puzzle.Turn(fly, S.pieces, S.fly, S.target, S.lookMs,
    (k,of)=>{
      $("seen").textContent = fmt(T("ui.scanning"), {k:k, of:of});
      $("scanBar").style.width=(100*k/of)+"%";
      if(k % Math.max(4, Math.round(70/S.lookMs)) === 0) SFX.tick();
      if(Date.now()-S.said>2200){ S.said=Date.now();
        says("look",{seen:k,of:of,ms:S.lookMs.toFixed(0)}); }
    },
    ([i,j])=>{
      if(S.winner) return;
      thinking(false);
      const before=S.fly.slice();
      [S.fly[i],S.fly[j]]=[S.fly[j],S.fly[i]];
      S.moves.fly++;
      const flyGained = [i,j].filter(x=>S.fly[x]===x).length;
      animateSwap("fly", before, S.fly.slice(), i, j, "#ff6fb5", ()=>{
        hud();
        if(flyGained) SFX.land();
        fly.look(S.pieces.render(S.fly));
        drawMap("pr", fly.map("pr", PRW*PRH), PRW, PRH);
        drawMap("l1", fly.map("l1", MAPW*MAPH), MAPW, MAPH);
        const h=home(S.fly);
        S.said=Date.now();
        if(S.n-h<=2) says("close");
        else says(h>S.lastHome?"good":(h<S.lastHome?"bad":"look"),
                  {seen:S.n,of:S.n,ms:S.lookMs.toFixed(0)});
        S.lastHome=h;
        if(h===S.n) return finish("fly");
        flyTurn();
      }, true);
    });
}

function finish(who){
  S.winner=who; if(S.turn) S.turn.stop();
  clearInterval(S.clock); clearTimeout(S.count); thinking(false);
  const won=who==="human", secs=((Date.now()-S.started)/1000).toFixed(1);
  $("clock").textContent=secs; $("seen").textContent="—";
  says(won?"lose":"win");
  if(won){ SFX.win(); confetti(["#4ade80","#5aa2ff","#fbbf24","#ffffff","#c9a6ff"]); }
  else SFX.lose();
  $("overBig").textContent = T(won ? "over.win" : "over.lose");
  $("overBig").style.color = won ? "var(--ok)" : "var(--fly)";
  $("overWhy").textContent = "\u201C" +
    fmt(pick(T(won ? "lord.lose" : "lord.win")), {n: home(S.human), t: S.n}) + "\u201D";

  tallyShow(null, null);
  Promise.all([tallyHit(won ? "human" : "fly"), tallyRead(won ? "fly" : "human")])
    .then(([mine, other]) => tallyShow(won ? mine : other, won ? other : mine));


  setTimeout(()=>$("over").classList.add("on"),420);
}

// ------------------------------------------------------------------ 입력
/** Which slot a pointer is over, or -1. */
function slotAt(e){
  const cv=$("you"), r=cv.getBoundingClientRect(), P=S.pieces;
  if(!P) return -1;
  const pt = e.changedTouches ? e.changedTouches[0] : e;
  const c = ((pt.clientX-r.left)/(r.width/P.cols))|0;
  const w = ((pt.clientY-r.top)/(r.height/P.rows))|0;
  if(c<0||c>=P.cols||w<0||w>=P.rows) return -1;
  const slot = w*P.cols+c;
  return (slot>=0 && slot<S.n) ? slot : -1;
}

/** Pointer position in the canvas's own pixels, which is what paint() draws in. */
function canvasXY(e){
  const cv=$("you"), r=cv.getBoundingClientRect();
  const pt = e.changedTouches ? e.changedTouches[0] : e;
  return [(pt.clientX-r.left) * cv.width / r.width,
          (pt.clientY-r.top) * cv.height / r.height];
}

/** The one place a human move happens, whether it came from a tap or a drag. */
function doSwap(a, b){
  if(a===b || a<0 || b<0) return;
  const before=S.human.slice();
  [S.human[a],S.human[b]]=[S.human[b],S.human[a]];
  S.moves.human++; S.busy=true; SFX.swap();
  const gained = [a,b].filter(x=>S.human[x]===x).length;
  animateSwap("you", before, S.human.slice(), a, b, "#5aa2ff", ()=>{
    S.busy=false; hud();
    if(gained) SFX.land();
    const h=home(S.human);
    if(h-home(S.fly)>=2 && Date.now()-S.said>3500){ S.said=Date.now(); says("behind"); }
    if(h===S.n) finish("human");
  });
}

function tap(e){
  if(S.winner||S.locked||S.busy||!S.pieces) return;
  const slot=slotAt(e);
  if(slot<0) return;
  if(S.pick<0){ S.pick=slot; SFX.pick();
    paint("you",S.human,{mark:[slot],colour:"#5aa2ff"}); return; }
  if(S.pick===slot){                                   // 같은 조각을 다시 -> 취소
    S.pick=-1; SFX.drop(); paint("you",S.human); return; }
  const a=S.pick; S.pick=-1;
  doSwap(a, slot);
}

/**
 * Drag to move, on a mouse or a finger alike.
 *
 * Pointer events cover both, so there is one path rather than a mouse one and a
 * touch one that disagree. A press that barely moves is still a tap, so the
 * two-tap way keeps working for anyone who prefers it; past a few pixels the
 * piece lifts and follows, and dropping it on another slot swaps them.
 */
(function(){
  const cv = $("you");
  let drag = null;
  const THRESHOLD = 7;                                  // 탭과 끌기를 가르는 거리

  function show(e){
    const P=S.pieces; if(!P||!drag) return;
    const [px,py] = canvasXY(e);
    const tw = cv.width/P.cols, th = cv.height/P.rows;
    const over = slotAt(e);
    paint("you", S.human, {
      hide:[drag.slot],
      mark: (over>=0 && over!==drag.slot) ? [over] : null,
      colour:"#5aa2ff",
      moving:[{piece:S.human[drag.slot], x:px-tw/2, y:py-th/2}],
    });
  }

  cv.addEventListener("pointerdown", e=>{
    if(S.winner||S.locked||S.busy||!S.pieces) return;
    const slot = slotAt(e); if(slot<0) return;
    drag = {slot, x:e.clientX, y:e.clientY, moved:false, id:e.pointerId};
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  });

  cv.addEventListener("pointermove", e=>{
    if(!drag || e.pointerId!==drag.id) return;
    if(!drag.moved){
      if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < THRESHOLD) return;
      drag.moved = true;
      cv.classList.add("dragging");
      if(S.pick !== drag.slot) SFX.pick();
      S.pick = -1;
    }
    e.preventDefault();
    show(e);
  });

  function end(e){
    if(!drag || e.pointerId!==drag.id) return;
    const from = drag.slot, moved = drag.moved, over = slotAt(e);
    drag = null;
    cv.classList.remove("dragging");
    try{ cv.releasePointerCapture(e.pointerId); }catch(err){}
    if(!moved) return tap(e);                           // 안 움직였으면 탭이다
    if(over>=0 && over!==from) doSwap(from, over);
    else { SFX.drop(); paint("you", S.human); }         // 제자리에 놓았다
  }
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", e=>{
    if(!drag || e.pointerId!==drag.id) return;
    drag = null; cv.classList.remove("dragging"); paint("you", S.human);
  });

  // PointerEvent 가 없는 구형 브라우저는 예전 방식 그대로 탭만 쓴다
  if(!window.PointerEvent){
    let touched = 0;
    cv.addEventListener("touchend", e=>{ touched=Date.now(); e.preventDefault(); tap(e); },
                        {passive:false});
    cv.addEventListener("click", e=>{ if(Date.now()-touched < 600) return; tap(e); });
  }
})();

// 원본 확대. 시계는 계속 간다 -- 들여다보는 데 시간이 드는 것도 게임이다.
$("target").addEventListener("click", ()=>{
  if(!S.big) return;
  const z=$("zoomc");
  z.width=S.big.width*2; z.height=S.big.height*2;
  const c=z.getContext("2d"); c.imageSmoothingEnabled=false;
  c.drawImage(S.big,0,0,z.width,z.height);
  $("zoom").classList.add("on");
});
$("zoom").addEventListener("click", ()=>$("zoom").classList.remove("on"));

function showSpeed(){
  const x=SPEEDS[+$("speed").value];
  const wide = !window.matchMedia("(orientation:portrait),(max-width:840px)").matches;
  $("speedv").textContent = wide
    ? "×"+x+(x===1?" "+T("ui.speedReal"):"")+" · "+(BASE_MS/x).toFixed(x<1?0:1)+"ms"
    : "×"+x;
}
// 세로 화면에서는 난도 문구를 조각 수만 남긴다. 긴 문구가 한 줄의 절반을
// 차지하면 가속 값 같은 게 밀려나 사라진다.
function labelSizes(){
  const rows = T(portrait() ? "sizesShort" : "sizes") || [];
  [...$("size").options].forEach((o,i)=>{ if(rows[i]) o.textContent = rows[i]; });
}
$("speed").oninput=showSpeed;
// 시작은 설명을 먼저 띄운다. 규칙을 모르고 카운트다운부터 마주하면
// 첫 판은 그냥 버리는 판이 된다. 두 번째부터가 귀찮은 사람을 위해 끄는 칸을 둔다.
function howto(){
  if(!fly) return;
  if(skipHowto()){ start(); return; }
  const [rows,cols] = (portrait()?SIZES_PORT:SIZES_LAND)[+$("size").value];
  const n = rows*cols, c = n*(n-1)/2, ms = BASE_MS / SPEEDS[+$("speed").value];
  const pace = fmt(T("howto.pace"),
    {n:n, c:c, ms:ms.toFixed(ms<10?1:0), sec:(c*ms/1000).toFixed(1)});
  for(const li of document.querySelectorAll('[data-i18n-list="howto.rules2"] li'))
    li.innerHTML = li.innerHTML.split("{pace}").join(pace);
  $("howSkip").checked = false;
  howPage(1);
  Promise.all([tallyRead("human"), tallyRead("fly")]).then(([h,f])=>{
    if(h === null && f === null) return;
    $("howTally").textContent = fmt(T("howto.tally"),
      {h:(h|0).toLocaleString(), f:(f|0).toLocaleString()});
  });
  $("howto").classList.add("on");
}
function skipHowto(){
  try{ return localStorage.getItem("btf:skipHowto") === "1"; }catch(e){ return false; }
}
function howBegin(){
  try{ if($("howSkip").checked) localStorage.setItem("btf:skipHowto","1"); }catch(e){}
  $("howto").classList.remove("on");
  start();
}
function howPage(n){
  $("howP1").hidden = (n !== 1);
  $("howP2").hidden = (n !== 2);
}
$("howStart").onclick  = howBegin;
$("howStart2").onclick = howBegin;
$("howMore").onclick   = ()=>howPage(2);
$("howBack").onclick   = ()=>howPage(1);
$("go").onclick=howto;
$("again").onclick=idle;
$("pickImg").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const img=new Image();
  img.onload=()=>{
    picture=img;
    let o=[...$("pic").options].find(x=>x.value==="mine");
    if(!o){ o=document.createElement("option"); o.value="mine"; $("pic").appendChild(o); }
    o.textContent = (T("pictures")||{}).mine || "my image";
    $("pic").value="mine";
  };
  img.src=URL.createObjectURL(f);
};

let wasPortrait=portrait();
window.addEventListener("resize", ()=>{
  if(portrait()!==wasPortrait){          // 화면을 돌리면 자르기가 바뀐다
    wasPortrait=portrait();
    if(S.pieces) return start();
  }
  labelSizes();
  relayout();
});
window.addEventListener("orientationchange", ()=>setTimeout(()=>{
  wasPortrait=portrait(); if(S.pieces) start();
}, 250));
// 웹폰트가 늦게 들어오면 줄 높이가 바뀌고 상자도 바뀐다. 들어온 뒤 한 번 더 잰다.
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>relayout());

// ------------------------------------------------------------------ 시작
$("pic").innerHTML = Object.keys(Puzzle.PICTURES)
  .map((k,i)=>'<option value="'+k+'"'+(i?"":" selected")+'></option>').join("");
$("lang").innerHTML = Object.keys(LANG)
  .map(k=>'<option value="'+k+'">'+LANG[k].name+"</option>").join("");
$("lang").onchange = ()=>setLang($("lang").value);
// 저장된 선택이 있으면 그것, 없으면 브라우저 언어, 그래도 없으면 한국어.
let want = "";
try{ want = localStorage.getItem("btf:lang") || ""; }catch(e){}
if(!LANG[want]) want = (navigator.language || "").slice(0,2);
if(!LANG[want]) want = "ko";
$("lang").value = want;
setLang(want);
fetch("brain.bin").then(r=>r.arrayBuffer()).then(buf=>{
  const g=FlyBrain.parse(buf);
  fly=new FlyBrain.Fly(g);
  S.neurons = g.N; S.edges = g.E; S.brainKB = Math.round(buf.byteLength/1024);
  brainLine();
  S.neurons=g.N; S.edges=g.E;
  $("go").disabled=false;
  observe("you", ".a-you .wrap");
  observe("fly", ".a-fly .wrap");
  observe("target", ".a-mid .tgtwrap");
  drawMap("pr", fly.map("pr", PRW*PRH), PRW, PRH);
  drawMap("l1", fly.map("l1", MAPW*MAPH), MAPW, MAPH);
}).catch(e=>{ $("brain").textContent = "\u2014 " + e.message; });
